name: querybox
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: devel
priority: optional
maintainer: Ali Kamandlu <alikmndlu1@gmail.com>
description: Local-first SQL query manager, scratchpad, and database workbench.
homepage: https://github.com/alikmndlu/QueryBox
license: MIT
# nfpm resolves every `src` against its own working directory, not this file's
# directory, so these are repo-root relative and nfpm must run from the repo root.
contents:
  - src: build/bin/QueryBox
    dst: /opt/querybox/QueryBox
    file_info:
      mode: 0755
  - src: build/linux/querybox.desktop
    dst: /usr/share/applications/querybox.desktop
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/256x256/apps/querybox.png
  - src: build/appicon.png
    dst: /usr/share/pixmaps/querybox.png
  - src: LICENSE
    dst: /usr/share/doc/querybox/copyright
  - src: /opt/querybox/QueryBox
    dst: /usr/bin/querybox
    type: symlink
overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
    recommends:
      - libayatana-appindicator3-1
      - xdg-utils
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
    recommends:
      - libayatana-appindicator-gtk3
      - xdg-utils
